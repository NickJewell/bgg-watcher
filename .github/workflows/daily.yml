name: Daily snapshot

on:
  schedule:
    - cron: "17 10 * * *" # once a day, off-peak for North America
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Snapshot
        env:
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: python -m bggwatch run
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data WATCHLIST.md
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          git push
